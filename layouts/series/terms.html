{{ define "main" }}
<header class="page-heading">
  <p class="eyebrow">SERIALS</p>
  <h1>连载书架</h1>
  <p class="hero-copy">点击书名或卷名，可以展开查看章节。</p>
</header>

<div class="book-tree">
  {{ range .Pages }}
    <details class="book-tree-item">
      <summary>
        <span class="tree-title">{{ .Title }}</span>
        <span class="tree-count">{{ len .Pages }} 章</span>
      </summary>
      <div class="volume-tree">
        {{ partial "volume-tree.html" .Pages }}
      </div>
    </details>
  {{ else }}
    <p class="empty">暂时没有连载。</p>
  {{ end }}
</div>
{{ end }}
