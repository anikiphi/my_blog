{{ define "main" }}
<article class="post">
  <header class="post-header">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <h1>{{ .Title }}</h1>
    {{ with .GetTerms "tags" }}
      <div class="tags">
        {{ range . }}<a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
      </div>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
